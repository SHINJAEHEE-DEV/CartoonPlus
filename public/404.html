<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <script>
      (function () {
        // Keep the existing GitHub Pages URL working during the migration.
        var base = window.location.hostname.endsWith('.github.io') ? '/CartoonPlus/' : '/';
        var path = window.location.pathname;
        if (path.indexOf(base) === 0) {
          var route = path.slice(base.length);
          window.location.replace(base + '#/' + route + window.location.search);
        } else {
          window.location.replace(base);
        }
      }());
    </script>
  </head>
  <body></body>
</html>
