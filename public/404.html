<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <script>
      (function () {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        // GitHub Pages repository subpath compatibility
        if (window.location.hostname.endsWith('.github.io')) {
          var base = '/CartoonPlus/';
          if (path.indexOf(base) === 0) {
            var route = path.slice(base.length);
            window.location.replace(base + '#/' + route + search);
            return;
          }
        }
        // Cloudflare Pages / Vercel / Netlify SPA fallback: load index.html preserving URL
        window.location.replace(
          '/' + (path.startsWith('/') ? path.slice(1) : path) + search + hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
