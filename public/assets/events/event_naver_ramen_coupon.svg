<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #03C75A; stroke: #1E1E1E; stroke-width: 3.5; rx: 20px; }
      .badge-bg { fill: #1E1E1E; }
      .badge-txt { fill: #FED943; font-family: 'Pretendard', sans-serif; font-weight: 900; font-size: 11px; letter-spacing: 0.05em; }
      .title { fill: #FFFFFF; font-family: 'Pretendard', sans-serif; font-weight: 900; font-size: 22px; letter-spacing: -0.03em; }
      .coupon-card { fill: #FFFFFF; stroke: #1E1E1E; stroke-width: 2.5; rx: 14px; }
      .coupon-badge { fill: #D32F2F; rx: 6px; }
      .coupon-badge-txt { fill: #FFFFFF; font-family: 'Pretendard', sans-serif; font-weight: 900; font-size: 10px; }
      .coupon-title { fill: #1E1E1E; font-family: 'Pretendard', sans-serif; font-weight: 900; font-size: 16px; }
      .coupon-sub { fill: #03C75A; font-family: 'Pretendard', sans-serif; font-weight: 800; font-size: 12px; }
      .foot-txt { fill: #E8F8EE; font-family: 'Pretendard', sans-serif; font-weight: 700; font-size: 11px; }
    </style>
  </defs>

  <!-- Background -->
  <rect x="3" y="3" width="394" height="234" class="bg" />

  <!-- Top Badge -->
  <rect x="22" y="20" width="120" height="24" rx="12" class="badge-bg" />
  <text x="82" y="36" text-anchor="middle" class="badge-txt">NAVER REVIEW</text>

  <!-- Title -->
  <text x="22" y="76" class="title">네이버 영수증 포토 리뷰 이벤트</text>

  <!-- Coupon Box -->
  <g transform="translate(22, 92)">
    <rect width="356" height="92" class="coupon-card" />

    <!-- Coupon Badge & Text -->
    <rect x="16" y="16" width="70" height="22" class="coupon-badge" />
    <text x="51" y="31" text-anchor="middle" class="coupon-badge-txt">쿠폰 증정</text>

    <text x="96" y="33" class="coupon-title">라면무료 + 토핑무료(공짜) 쿠폰</text>
    <text x="16" y="60" class="coupon-sub">🍜 대파 · 숙주 · 떡사리 · 계란 무제한 토핑 바 포함</text>
    <text x="16" y="78" style="fill:#6B6354; font-size:11px; font-weight:700;">포토 리뷰 작성 후 카운터 직원 확인 시 즉시 사용 가능</text>
  </g>

  <!-- Footer -->
  <text x="24" y="210" class="foot-txt">* 쿠폰 발급일 포함 30일 이내 사용 가능 · 타 쿠폰 중복 사용 불가</text>
</svg>
