<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #03C75A; stroke: #1E1E1E; stroke-width: 3.5; rx: 20px; }
      .tag { fill: #1E1E1E; }
      .tag-text { fill: #FED943; font-family: 'Pretendard', sans-serif; font-weight: 900; font-size: 12px; letter-spacing: 0.05em; }
      .title { fill: #FFFFFF; font-family: 'Pretendard', sans-serif; font-weight: 900; font-size: 20px; }
      .sub { fill: #E8F8EE; font-family: 'Pretendard', sans-serif; font-weight: 700; font-size: 13px; }
      .card { fill: #FFFFFF; stroke: #1E1E1E; stroke-width: 2.5; rx: 14px; }
      .badge-text { fill: #03C75A; font-family: 'Pretendard', sans-serif; font-weight: 900; font-size: 14px; }
      .benefit-title { fill: #1E1E1E; font-family: 'Pretendard', sans-serif; font-weight: 900; font-size: 13px; }
      .benefit-desc { fill: #6B6354; font-family: 'Pretendard', sans-serif; font-weight: 700; font-size: 11px; }
      .star { fill: #FFD21D; }
    </style>
  </defs>

  <!-- Background with brutalist border -->
  <rect x="3" y="3" width="394" height="234" class="bg" />

  <!-- Top Badge -->
  <rect x="24" y="22" width="100" height="26" rx="13" class="tag" />
  <text x="74" y="39" text-anchor="middle" class="tag-text">NAVER PLACE</text>

  <!-- Stars -->
  <g transform="translate(136, 26)">
    <path d="M7 0l2 4.5 5 .7-3.6 3.5.9 5-4.3-2.3-4.3 2.3.9-5-3.6-3.5 5-.7z" class="star" />
    <path d="M24 0l2 4.5 5 .7-3.6 3.5.9 5-4.3-2.3-4.3 2.3.9-5-3.6-3.5 5-.7z" class="star" />
    <path d="M41 0l2 4.5 5 .7-3.6 3.5.9 5-4.3-2.3-4.3 2.3.9-5-3.6-3.5 5-.7z" class="star" />
    <path d="M58 0l2 4.5 5 .7-3.6 3.5.9 5-4.3-2.3-4.3 2.3.9-5-3.6-3.5 5-.7z" class="star" />
    <path d="M75 0l2 4.5 5 .7-3.6 3.5.9 5-4.3-2.3-4.3 2.3.9-5-3.6-3.5 5-.7z" class="star" />
  </g>

  <!-- Title & Subtitle -->
  <text x="24" y="80" class="title">네이버 영수증 포토 리뷰</text>
  <text x="24" y="103" class="sub">사진 1장 + 정성 후기 작성 시 즉시 혜택 증정!</text>

  <!-- Benefit Cards Grid (2 Cards) -->
  <!-- Card 1: 포토 리뷰 -->
  <g transform="translate(24, 120)">
    <rect width="168" height="96" class="card" />
    <rect x="12" y="12" width="28" height="28" rx="8" fill="#E8F8EE" />
    <text x="26" y="31" text-anchor="middle" class="badge-text">🎁</text>
    <text x="48" y="25" class="benefit-title">포토 리뷰 작성</text>
    <text x="48" y="38" style="fill:#03C75A; font-size:10px; font-weight:800;">현장 즉시 확인</text>
    <text x="12" y="62" class="benefit-desc">· 캔음료 또는 과자 1종</text>
    <text x="12" y="78" class="benefit-desc">· 카운터 인증 시 즉시 제공</text>
  </g>

  <!-- Card 2: 블로그/SNS 리뷰 -->
  <g transform="translate(208, 120)">
    <rect width="168" height="96" class="card" />
    <rect x="12" y="12" width="28" height="28" rx="8" fill="#FFF3C9" />
    <text x="26" y="31" text-anchor="middle" class="badge-text">🎟️</text>
    <text x="48" y="25" class="benefit-title">블로그/SNS 인증</text>
    <text x="48" y="38" style="fill:#8A6A00; font-size:10px; font-weight:800;">정성 후기 이벤트</text>
    <text x="12" y="62" class="benefit-desc">· 1시간 무료 이용권 증정</text>
    <text x="12" y="78" class="benefit-desc">· 다음 방문 시 사용 가능</text>
  </g>
</svg>
