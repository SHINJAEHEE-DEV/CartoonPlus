<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6" />
      <stop offset="100%" stop-color="#FEE877" />
    </linearGradient>
    <!-- Card Shadow -->
    <filter id="brutalShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#1E1E1E" />
    </filter>
  </defs>

  <!-- Background Canvas with Border -->
  <rect x="12" y="12" width="616" height="376" rx="28" fill="url(#bgGrad)" stroke="#1E1E1E" stroke-width="6" filter="url(#brutalShadow)"/>

  <!-- Decorative Sparkles / Confetti -->
  <g stroke="#1E1E1E" stroke-width="3" stroke-linecap="round">
    <!-- Star 1 -->
    <path d="M 120 70 L 120 90 M 110 80 L 130 80" />
    <!-- Star 2 -->
    <path d="M 520 80 L 520 100 M 510 90 L 530 90" />
    <!-- Star 3 -->
    <path d="M 140 310 L 140 326 M 132 318 L 148 318" />
    <!-- Small dots / circles -->
    <circle cx="80" cy="180" r="6" fill="#FED943" stroke="#1E1E1E" stroke-width="3" />
    <circle cx="560" cy="220" r="8" fill="#FF6B6B" stroke="#1E1E1E" stroke-width="3" />
    <circle cx="490" cy="300" r="5" fill="#4DABF7" stroke="#1E1E1E" stroke-width="3" />
    <circle cx="160" cy="130" r="4" fill="#51CF66" stroke="#1E1E1E" stroke-width="3" />
  </g>

  <!-- Mascot Puppy Centerpiece -->
  <g transform="translate(320, 165)">
    <!-- Head -->
    <ellipse cx="0" cy="-10" rx="72" ry="60" fill="#FFFFFF" stroke="#1E1E1E" stroke-width="5" />
    
    <!-- Fluffy Left Ear -->
    <path d="M -54 -30 C -85 -55 -105 10 -75 35 C -60 45 -48 20 -48 0 Z" fill="#FFFFFF" stroke="#1E1E1E" stroke-width="5" stroke-linejoin="round" />
    <!-- Fluffy Right Ear -->
    <path d="M 54 -30 C 85 -55 105 10 75 35 C 60 45 48 20 48 0 Z" fill="#FFFFFF" stroke="#1E1E1E" stroke-width="5" stroke-linejoin="round" />

    <!-- Cute Eyes -->
    <ellipse cx="-24" cy="-12" rx="6.5" ry="9" fill="#1E1E1E" />
    <ellipse cx="24" cy="-12" rx="6.5" ry="9" fill="#1E1E1E" />
    <!-- Eye highlights -->
    <circle cx="-26" cy="-15" r="2.5" fill="#FFFFFF" />
    <circle cx="22" cy="-15" r="2.5" fill="#FFFFFF" />

    <!-- Rosy Cheeks -->
    <ellipse cx="-42" cy="5" rx="11" ry="7" fill="#FF8787" opacity="0.85" />
    <ellipse cx="42" cy="5" rx="11" ry="7" fill="#FF8787" opacity="0.85" />

    <!-- Cute Nose & Smile -->
    <ellipse cx="0" cy="-2" rx="8" ry="6" fill="#1E1E1E" />
    <path d="M -8 8 Q 0 16 8 8" fill="none" stroke="#1E1E1E" stroke-width="4" stroke-linecap="round" />

    <!-- Party Hat -->
    <polygon points="0,-75 -24,-38 24,-38" fill="#FF6B6B" stroke="#1E1E1E" stroke-width="4.5" stroke-linejoin="round"/>
    <circle cx="0" cy="-78" r="7" fill="#FED943" stroke="#1E1E1E" stroke-width="3.5" />
    <line x1="-16" y1="-50" x2="16" y2="-50" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />

    <!-- Paws -->
    <ellipse cx="-30" cy="46" rx="12" ry="9" fill="#FFFFFF" stroke="#1E1E1E" stroke-width="4" />
    <ellipse cx="30" cy="46" rx="12" ry="9" fill="#FFFFFF" stroke="#1E1E1E" stroke-width="4" />
    <circle cx="-30" cy="46" r="4" fill="#FF8787" />
    <circle cx="30" cy="46" r="4" fill="#FF8787" />
  </g>

  <!-- Top Badge -->
  <g transform="translate(320, 60)">
    <rect x="-110" y="-18" width="220" height="36" rx="18" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2" />
    <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#FED943" letter-spacing="2">
      CARTOONPLUS EVENT
    </text>
  </g>

  <!-- Bottom Text Banner -->
  <g transform="translate(320, 312)">
    <rect x="-190" y="-22" width="380" height="52" rx="26" fill="#FFFFFF" stroke="#1E1E1E" stroke-width="4.5" filter="url(#brutalShadow)"/>
    <text x="0" y="10" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="900" fill="#1E1E1E" letter-spacing="-0.5">
      특별한 매장 혜택 &amp; 이벤트
    </text>
  </g>
</svg>
