<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FED943; stroke: #1E1E1E; stroke-width: 3.5; rx: 20px; }
      .badge-bg { fill: #1E1E1E; }
      .badge-txt { fill: #FED943; font-family: 'Pretendard', sans-serif; font-weight: 900; font-size: 11px; letter-spacing: 0.05em; }
      .main-title { fill: #1E1E1E; font-family: 'Pretendard', sans-serif; font-weight: 900; font-size: 26px; letter-spacing: -0.04em; }
      .price-box { fill: #FFFFFF; stroke: #1E1E1E; stroke-width: 2.5; rx: 12px; }
      .price-txt { fill: #D32F2F; font-family: 'Pretendard', sans-serif; font-weight: 900; font-size: 18px; }
      .gift-box { fill: #1E1E1E; rx: 10px; }
      .gift-txt { fill: #FED943; font-family: 'Pretendard', sans-serif; font-weight: 900; font-size: 13px; }
      .sub-txt { fill: #5C5344; font-family: 'Pretendard', sans-serif; font-weight: 700; font-size: 11px; }
    </style>
  </defs>

  <!-- Background -->
  <rect x="3" y="3" width="394" height="234" class="bg" />

  <!-- Top Badge -->
  <rect x="22" y="20" width="100" height="24" rx="12" class="badge-bg" />
  <text x="72" y="36" text-anchor="middle" class="badge-txt">LIMITED EVENT</text>

  <!-- Title -->
  <text x="22" y="78" class="main-title">평일 종일 이용권</text>

  <!-- Price Tag -->
  <g transform="translate(22, 94)">
    <rect width="210" height="38" class="price-box" />
    <text x="105" y="25" text-anchor="middle" class="price-txt">음료 포함 15,000원</text>
  </g>

  <!-- Free Gift Box -->
  <g transform="translate(22, 142)">
    <rect width="356" height="42" class="gift-box" />
    <text x="178" y="27" text-anchor="middle" class="gift-txt">🎁 젤라또(무료) or 라면(무료) 선택 증정</text>
  </g>

  <!-- Footnote -->
  <text x="24" y="206" class="sub-txt">* 10월 말까지 한정 진행 · 타 쿠폰 중복 사용 불가(종일권 한정)</text>
</svg>
