<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>카툰플러스 음성 비교</title>
<style>body{font:16px/1.65 system-ui;background:#f6f5f0;color:#222;max-width:850px;margin:40px auto;padding:0 24px}h1{margin-bottom:4px}small{color:#666}section{background:white;padding:24px;border-radius:16px;margin:20px 0}label{display:block;margin:12px 0 4px;font-weight:650}select,textarea,button,input{font:inherit}select,textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #bbb;border-radius:8px}textarea{height:245px}button{border:0;border-radius:8px;padding:12px 20px;margin:12px 8px 0 0;cursor:pointer;background:#ffd94a}button.secondary{background:#ececec}#status{padding:14px;background:#f0eee6;border-radius:8px}input{width:230px}output{margin-left:12px}</style>
<h1>매장 안내 음성 비교</h1><small>임시 청취 테스트 · 이 컴퓨터에서만 재생 · 운영 데이터는 변경하지 않습니다.</small>
<p>무료 한국어 목소리로 안내 문구가 자연스럽게 들리는지 확인합니다. 음성 → 속도 → 쉬는 시간 순서로 한 번에 하나씩 바꿔 비교하세요.</p>
<section><div id="status" role="status">음성 목록을 불러오는 중</div><label for="voice">한국어 목소리</label><select id="voice"></select><button class="secondary" id="refresh">목소리 다시 찾기</button>
<label for="rate">읽는 속도 <output id="rateValue">0.95</output></label><input id="rate" type="range" min="0.7" max="1.2" step="0.05" value="0.95">
<label for="gap">문장 사이 쉬는 시간 <output id="gapValue">250ms</output></label><input id="gap" type="range" min="0" max="800" step="50" value="250">
<label for="preset">안내 문구</label><select id="preset"></select><label for="text">원문 (테스트 중 편집 가능)</label><textarea id="text"></textarea>
<button id="play">▶ 선택한 목소리 듣기</button><button id="stop" class="secondary">■ 중지</button><p><small>짧은 비교: 음료 픽업 요청 → 긴 문장 비교: 기본 안내 → 숫자 발음 비교: 마감 안내. 중지한 뒤 같은 문구로 다른 목소리를 들어보세요.</small></p><p id="settings"></p></section>
<script>
const presets=[{"title": "음료 픽업 요청", "text": "주문하신 음료가 카운터에 준비되어있습니다.\n카카오톡 알림 확인 부탁드립니다."}, {"title": "기본 (매일 2시)", "text": "카툰플러스를 이용해주시는 고객님들께 잠시 안내 말씀 드립니다. 매장 이용 후 퇴실 시에는 사용하신 담요, 만화책, 식기 등 모두 반납해주시고 쓰레기는 쓰레기통에 버려주시길 바랍니다.\n다시 한번 안내말씀 드립니다. 매장 이용 후 퇴실 시에는 사용하신 담요, 만화책, 식기 등 모두 반납해주시고 쓰레기는 쓰레기통에 버려주시길 바랍니다.\n감사합니다."}, {"title": "만석 (직원이 수동)", "text": "카툰플러스를 이용해주시는 고객님들께 잠시 안내 말씀 드립니다. 매장 이용 후 퇴실 시에는 사용하신 담요, 만화책, 식기 등 모두 반납해주시고 자리 정돈 부탁드립니다.\n또한, 현재 만석이므로 자리 이동이 제한된다는 점 안내드립니다.\n다시 한번 안내말씀 드립니다. 매장 이용 후 퇴실 시에는 사용하신 담요, 만화책, 식기 등 모두 반납해주시고 자리 정돈 부탁드립니다.\n또한, 현재 만석이므로 자리 이동이 제한된다는 점 안내드립니다.\n감사합니다."}, {"title": "소음 (직원이 수동)", "text": "카툰플러스를 이용해주시는 고객님들께 잠시 안내 말씀 드립니다. 매장 이용 후 퇴실 시에는 사용하신 담요, 만화책, 식기 등 모두 반납해주시고 자리 정돈 부탁드립니다.\n또한, 모든 고객님들이 편안하게 이용하실 수 있도록, 큰 소리는 삼가 주시길 부탁드립니다.\n다시 한번 안내말씀 드립니다. 매장 이용 후 퇴실 시에는 사용하신 담요, 만화책, 식기 등 모두 반납해주시고 자리 정돈 부탁드립니다.\n또한, 모든 고객님들이 편안하게 이용하실 수 있도록, 큰 소리는 삼가 주시길 부탁드립니다.\n감사합니다."}, {"title": "신분증 검사 (9시 45분 ~ 9시 50분)", "text": "카툰플러스를 이용해주시는 고객님들께 잠시 안내 말씀 드립니다.\n잠시 후 10시부터 신분증 확인을 진행 할 예정입니다.\n매장을 계속 이용하실 고객님께서는, 실물 신분증을 미리 꺼내어 준비하여주시길 바랍니다.\n신분증이 없으실 경우 이용이 불가 합니다.\n또한, 매장 이용 후 퇴실 시에는 사용하신 담요, 만화책, 식기 등 모두 반납해주시고 쓰레기는 쓰레기통에 버려주시길 바랍니다.\n다시 한번 안내말씀 드립니다.\n잠시 후 10시부터 신분증 확인을 진행 할 예정입니다.\n매장을 계속 이용하실 고객님께서는, 실물 신분증을 미리 꺼내어 준비하여주시길 바랍니다.\n신분증이 없으실 경우 이용이 불가 합니다.\n또한, 매장 이용 후 퇴실 시에는 사용하신 담요, 만화책, 식기 등 모두 반납해주시고 쓰레기는 쓰레기통에 버려주시길 바랍니다.\n감사합니다."}, {"title": "마감 안내 (직원이 시간 설정 가능 기본은 10시 45분)", "text": "안내말씀 드립니다.\n저희매장 이용시간은 11시까지입니다.\n10시 50분부터 마감 준비를 하오니 참고 부탁드립니다.\n퇴실하실 떄에는 사용하신 담요, 만화책, 식기 등 모두 반납해주시고 사용하신 방 자리 정돈 부탁드립니다.\n다시 한번 안내말씀 드립니다.\n저희매장 이용시간은 11시까지입니다.\n10시 50분부터 마감 준비를 하오니 참고 부탁드립니다.\n퇴실하실 떄에는 사용하신 담요, 만화책, 식기 등 모두 반납해주시고 사용하신 방 자리 정돈 부탁드립니다.\n감사합니다."}];
const $=id=>document.getElementById(id);let voices=[],generation=0,timer,active;
const synth=window.speechSynthesis;
function status(t){$('status').textContent=t}
function showSettings(){$('rateValue').textContent=Number($('rate').value).toFixed(2);$('gapValue').textContent=$('gap').value+'ms';$('settings').textContent='현재 설정: '+($('voice').selectedOptions[0]?.textContent||'목소리 없음')+' / 속도 '+$('rate').value+' / 쉬는 시간 '+$('gap').value+'ms'}
function load(){if(!synth){status('이 브라우저는 음성 합성을 지원하지 않습니다.');$('play').disabled=true;return}const prev=$('voice').selectedOptions[0]?.textContent;voices=synth.getVoices().filter(v=>/^ko([_-]|$)/i.test(v.lang));$('voice').replaceChildren(...voices.map((v,i)=>new Option(v.name+' · '+(v.localService?'기기 음성':'온라인 음성'),i)));const idx=[...$('voice').options].findIndex(o=>o.textContent===prev);if(idx>=0)$('voice').selectedIndex=idx;$('play').disabled=!voices.length;status(voices.length?'한국어 목소리 '+voices.length+'개 · 재생 버튼을 눌러 비교하세요.':'한국어 목소리를 찾지 못했습니다. 잠시 후 다시 찾기를 누르세요.');showSettings()}
function stop(){generation++;clearTimeout(timer);if(synth)synth.cancel();active=null}
$('preset').replaceChildren(...presets.map((p,i)=>new Option(p.title,i)));$('text').value=presets[0].text;
$('preset').onchange=()=>{stop();$('text').value=presets[$('preset').value].text;status('문구 선택 완료')};
$('stop').onclick=()=>{stop();status('중지됨')};$('refresh').onclick=load;
for(const id of ['voice','rate','gap'])$(id).oninput=showSettings;
$('play').onclick=()=>{stop();const token=generation,voice=voices[$('voice').value],rate=Number($('rate').value),gap=Number($('gap').value),chunks=$('text').value.match(/[^.!?\n]+[.!?]?/g)||[];if(!voice||!chunks.length)return;let n=0;function next(){if(token!==generation)return;if(n>=chunks.length){status('재생 완료 · 다른 목소리로 비교해 보세요.');active=null;return}active=new SpeechSynthesisUtterance(chunks[n++].trim());active.lang='ko-KR';active.voice=voice;active.rate=rate;active.onend=()=>{if(token===generation)timer=setTimeout(next,gap)};active.onerror=e=>{if(token===generation)status('재생 오류: '+e.error)};status('재생 중 · '+voice.name+' · '+n+'/'+chunks.length+'문장');synth.speak(active)}next()};
if(synth)synth.addEventListener('voiceschanged',load);load();window.addEventListener('pagehide',stop);
</script></html>
